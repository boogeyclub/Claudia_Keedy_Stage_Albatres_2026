<section class="relative isolate overflow-hidden">
  <div class="pointer-events-none absolute -left-28 top-0 size-80 rounded-full bg-cacao-yellow/30 blur-3xl"></div>
  <div class="pointer-events-none absolute right-0 bottom-0 size-80 rounded-full bg-cacao-gold/20 blur-3xl"></div>

  <div class="relative mx-auto max-w-7xl px-4 py-8 sm:px-6 sm:py-11 lg:px-8 lg:py-14">
    <div class="rounded-[2rem] border border-cacao-gold/30 bg-white p-7 shadow-[0_22px_55px_rgba(59,33,23,0.12)] sm:p-10">
      <span class="inline-flex items-center gap-2 rounded-full bg-cacao-pale px-3 py-1.5 text-[0.68rem] font-extrabold uppercase tracking-[0.16em] text-cacao-roast">
        <span class="size-1.5 rounded-full bg-cacao-amber"></span>
        {{ workspaceTitle() }}
      </span>

      <h1 class="mt-5 max-w-3xl text-3xl font-black leading-tight tracking-[-0.055em] text-cacao-ink sm:text-4xl">{{ i18n.t(titleKey) }}</h1>
      <p class="mt-4 max-w-3xl text-base leading-7 text-cacao-brown sm:text-lg">{{ i18n.t(descriptionKey) }}</p>

      <p class="mt-8 inline-flex items-center gap-3 rounded-2xl bg-cacao-cream px-4 py-3 text-sm font-bold text-cacao-roast ring-1 ring-cacao-gold/30">
        <span class="size-2 rounded-full bg-cacao-gold"></span>
        {{ i18n.t('dashboard.section.placeholder') }}
      </p>
    </div>
  </div>
</section>
